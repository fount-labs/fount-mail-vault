# Fount Mail vault: holds the keyset in enclave memory and hands it only to
# verified vaults and edges. See README.md. Everything here is measured, so every
# value is public, and changing one takes a new release.
cvm-version: 0.14.17 # https://github.com/tinfoilsh/cvmimage/releases/latest, no `v`
cpus: 2
memory: 4096

attested-keys:
  - id: transfer # x25519: keysets, shares, and imports are sealed to this
    key: x25519

networks:
  # A vault only calls the other vault, and verification does no network I/O. The
  # egress is open because Tinfoil resolves every allowlisted name when it builds the
  # firewall, and a vault has to boot while its peer doesn't exist: vault-a first, and
  # either one after the other is gone. v0.1.0 failed to deploy on exactly that.
  peers:
    egress: open

containers:
  - name: vault
    image: "ghcr.io/fount-labs/fount-mail-vault@sha256:2bac4acd7375148aca9e8f8a093f893a195b3c7f311f0cf173715e42bb75a391" # from Build Image
    networks: [peers]
    keys: [transfer]
    attestation: true
    restart: always
    healthcheck:
      test: ["CMD", "/vault", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    ports: ["8080:8080"]
    env:
      - VAULT_REPO: "fount-labs/fount-mail-vault"
      - EDGE_REPO: "fount-labs/fount-mail-edge"
      - EDGE_MIN_TAG: "v0.1.0" # raise to retire old edge releases
      - KEYSET_COMMITMENT: "db2d1d4e7a8e474c78d48b89e93ccac6d9810776cda72ca8955000f9987dcb95" # empty only in the release that generates; see README
      - VAULT_PEERS: "vault-a.fount.containers.tinfoil.dev,vault-b.fount.containers.tinfoil.dev"
      - RECOVERY_RECIPIENTS: "age1fuy00zm6yjuygfxxng6tsnugy2qkc0qdsfqcxer2p3um6u2a347slrf550,age1w8709c8vfnrevkmlz75n34n074elz4tgv220jx9vlf4qfsu3ruksaelxer" # comma-separated age1... keys, held offline
      - RECOVERY_THRESHOLD: "1"
      - OPERATOR_KEY: "6b8cebf9ea0a064955b8673b49d715d70be2265b89c025b483a8e8ceec4ae986" # from vaultctl operator-keygen

shim:
  upstream-port: 8080
  paths:
    - /health
    - /status
    - /generate
    - /transfer/begin
    - /transfer/finish
    - /recovery/bundle
    - /recovery/share
    - /operator/begin
    - /operator/import
